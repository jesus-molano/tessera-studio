[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-studio"
version = "0.1.0"
description = "Local, read-only browser for Tessera catalogs and reuse decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tessera-studio = "tessera_studio.__main__:main"

[tool.setuptools.package-data]
tessera_studio = ["static/*"]
